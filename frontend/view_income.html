<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FinSight - View Income</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="icon" href="FS-favicon.png" type="image/x-icon" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
</head>
<body>
  <!-- Navbar -->
  <nav class="navbar gradient-bg">
    <h1>FinSight - Income</h1>
    <div class="nav-links">
      <a href="index.html"><i class="fa-solid fa-house"></i> Dashboard</a>
      <a href="add_income.html"><i class="fa-solid fa-circle-plus"></i> Add Income</a>
      <a href="add_expense.html"><i class="fa-solid fa-circle-plus"></i> Add Expense</a>
      <a href="#" id="logoutBtn"><i class="fa-solid fa-right-from-bracket"></i> Logout</a>
    </div>
  </nav>

  <!-- Main Container -->
  <div class="container">
    <!-- Filters -->
    <div class="filters">
      <div class="filter-title">💼 Filter & Sort</div>
      <div class="filter-controls">
        <input type="text" id="searchBox" placeholder="Search by title..." class="search-box" oninput="applyFilters()" />
        <select id="filterCategory" onchange="applyFilters()">
          <option value="">All Categories</option>
        </select>
        <select id="sortOrder" onchange="applyFilters()">
          <option value="desc">Newest First</option>
          <option value="asc">Oldest First</option>
        </select>
        <button class="reset-btn" onclick="resetFilters()">Reset</button>
      </div>
    </div>

    <!-- Total Income Card -->
    <div class="summary-container">
      <div class="summary-card">
        <h3>Total Income</h3>
        <p id="totalIncome">₨ 0</p>
      </div>
    </div>

    <!-- Income Table -->
    <h2>Income History</h2>
    <table>
      <thead>
        <tr>
          <th>Title</th>
          <th>Amount</th>
          <th>Category</th>
          <th>Date</th>
          <th>Action</th>
        </tr>
      </thead>
      <tbody id="incomeTableBody">
        <tr>
          <td colspan="5">Loading...</td>
        </tr>
      </tbody>
    </table>
  </div>

  <!-- Edit Modal -->
  <div id="editModal" class="modal">
    <div class="modal-content">
      <h2>Edit Income</h2>
      <input type="hidden" id="editId" />
      <label>Title:</label>
      <input type="text" id="editTitle" />
      <label>Amount:</label>
      <input type="number" id="editAmount" />
      <label>Category:</label>
      <input type="text" id="editCategory" />
      <label>Date:</label>
      <input type="date" id="editDate" />
      <button class="dashboard-btn" onclick="saveEdit()">💾 Save</button>
      <button class="delete-btn" onclick="closeEditModal()">❌ Cancel</button>
    </div>
  </div>

  <script>
    const BASE_URL = "http://127.0.0.1:8000";
    let allIncome = [];
    const token = localStorage.getItem("token");

    if (!token) window.location.href = "login.html";

    document.getElementById("logoutBtn").addEventListener("click", () => {
      localStorage.removeItem("token");
      window.location.href = "login.html";
    });

    async function loadIncome() {
      try {
        const res = await axios.get(`${BASE_URL}/income`, { headers:{ Authorization: `Bearer ${token}` }});
        allIncome = res.data || [];
        renderTable(allIncome);
        updateTotal(allIncome);
        populateCategories(allIncome);
      } catch(err) {
        console.error(err);
        if (err.response && err.response.status === 401) {
          alert("❌ Session expired. Please login again.");
          localStorage.removeItem("token");
          window.location.href = "login.html";
        }
      }
    }

    function renderTable(data) {
      const tbody = document.getElementById("incomeTableBody");
      tbody.innerHTML = "";
      if (!data.length) {
        tbody.innerHTML = "<tr><td colspan='5'>No income found</td></tr>";
        return;
      }
      data.forEach(inc => {
        const row = document.createElement("tr");
        row.innerHTML = `
          <td>${inc.title}</td>
          <td>₨ ${Number(inc.amount).toLocaleString()}</td>
          <td>${inc.category}</td>
          <td>${new Date(inc.date).toISOString().split("T")[0]}</td>
          <td>
            <button class="delete-btn" onclick="deleteIncome('${inc._id}')">Delete</button>
            <button class="dashboard-btn" onclick="openEditModal('${inc._id}','${inc.title}','${inc.amount}','${inc.category}','${inc.date}')">✏️ Edit</button>
          </td>
        `;
        tbody.appendChild(row);
      });
    }

    async function deleteIncome(id) {
      if (!confirm("Are you sure you want to delete this income?")) return;
      try {
        await axios.delete(`${BASE_URL}/income/${id}`, { headers: { Authorization: `Bearer ${token}` } });
        loadIncome();
      } catch(err) {
        console.error(err);
        alert("❌ Failed to delete income!");
      }
    }

    function openEditModal(id,title,amount,category,date){
      document.getElementById("editId").value = id;
      document.getElementById("editTitle").value = title;
      document.getElementById("editAmount").value = amount;
      document.getElementById("editCategory").value = category;
      document.getElementById("editDate").value = date.split("T")[0];
      document.getElementById("editModal").style.display = "flex";
    }

    function closeEditModal(){ document.getElementById("editModal").style.display="none"; }

    async function saveEdit() {
      const id = document.getElementById("editId").value;
      const updated = {
        title: document.getElementById("editTitle").value,
        amount: parseFloat(document.getElementById("editAmount").value),
        category: document.getElementById("editCategory").value,
        date: document.getElementById("editDate").value
      };
      try {
        await axios.put(`${BASE_URL}/income/${id}`, updated, { headers: { Authorization: `Bearer ${token}` }});
        closeEditModal();
        loadIncome();
      } catch(err) {
        console.error(err);
        alert("❌ Failed to update income!");
      }
    }

    function updateTotal(data) {
      const total = data.reduce((sum, inc) => sum + Number(inc.amount || 0), 0);
      document.getElementById("totalIncome").textContent = `₨ ${total.toLocaleString()}`;
    }

    function populateCategories(data) {
      const select = document.getElementById("filterCategory");
      const unique = [...new Set(data.map(i => i.category))];
      select.innerHTML = '<option value="">All Categories</option>';
      unique.forEach(cat => {
        const opt = document.createElement("option");
        opt.value = cat;
        opt.textContent = cat;
        select.appendChild(opt);
      });
    }

    function applyFilters() {
      const search = document.getElementById("searchBox").value.toLowerCase();
      const category = document.getElementById("filterCategory").value;
      const sortOrder = document.getElementById("sortOrder").value;

      let filtered = [...allIncome];
      if(category) filtered = filtered.filter(d => d.category === category);
      if(search) filtered = filtered.filter(d => d.title.toLowerCase().includes(search));
      filtered.sort((a,b) => sortOrder==="asc"? new Date(a.date)-new Date(b.date) : new Date(b.date)-new Date(a.date));

      renderTable(filtered);
      const total = filtered.reduce((sum,inc) => sum + Number(inc.amount||0), 0);
      document.getElementById("totalIncome").textContent = `₨ ${total.toLocaleString()}`;
    }

    function resetFilters() {
      document.getElementById("searchBox").value="";
      document.getElementById("filterCategory").value="";
      document.getElementById("sortOrder").value="desc";
      loadIncome();
    }

    document.addEventListener("DOMContentLoaded", loadIncome);
  </script>

  <!-- Footer -->
  <footer class="footer">
    <div class="footer-content">
      <div class="footer-left">
        <h3>💼 FinSight</h3>
        <p>Your intelligent personal finance tracker.</p>
      </div>
      <div class="footer-links">
        <a href="index.html"><i class="fa-solid fa-chart-line"></i> Dashboard</a>
        <a href="view_income.html"><i class="fa-solid fa-wallet"></i> Income</a>
        <a href="view_expense.html"><i class="fa-solid fa-receipt"></i> Expenses</a>
        <a href="ai_assistant.html"><i class="fa-solid fa-robot"></i> FinSight AI</a>
      </div>
      <div class="footer-right">
        <p>© <span id="year"></span> FinSight. All rights reserved.</p>
        <div class="social-icons">
          <a href="#"><i class="fa-brands fa-github"></i></a>
          <a href="#"><i class="fa-brands fa-linkedin"></i></a>
          <a href="#"><i class="fa-brands fa-twitter"></i></a>
        </div>
      </div>
    </div>
  </footer>

  <script>document.getElementById("year").textContent = new Date().getFullYear();</script>
</body>
</html>
